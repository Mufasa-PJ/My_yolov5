# Parameters
nc: 80 # number of classes 给定类别数目
depth_multiple: 0.33 # model depth multiple 深度控制系数 -->控制卷机操作的数量
width_multiple: 0.50 # layer channel multiple 宽度控制系数 -->控制卷积和的数量
anchors: # 给定先验框的尺度大小，是在原始图像上的图像大小
  - [10, 13, 16, 30, 33, 23] # P3/8 # 小物体的尺度
  - [30, 61, 62, 45, 59, 119] # P4/16 # 中等物体的尺度
  - [116, 90, 156, 198, 373, 326] # P5/32 # 达吾提的尺度

# YOLOv5 v6.0 backbone # 骨干网络结构的定义
backbone: # 骨干网络 P1 - P5
  # [from, number, module, args]
  # from : 当前层的输入，-1表示上一层
  # number：当前层重复数量，也就是重复多少次，实际值=max（1，number*depth_multiple）
  # module：给定当前层的模块字符串名称
  # arg：给定模块对象构建的入参
  # 第四个参数：[out_channels, kernel_size, stride, padding]

# 卷积核 3×3 → padding = 1
# 卷积核 5×5 → padding = 2
# 卷积核 6×6 → padding = 3
# 卷积核 1×1 → padding = 0

  [
    [-1, 1, Conv, [64, 6, 2, 2]], # 0-P1/2 。# [64, 6, 2, 2] = [输出通道，卷积核大小，步长，填充] image =304 由focus改了，改为卷积
    [-1, 1, Conv, [128, 3, 2]], # 1-P2/4 padding不写就是1 image = 152
    [-1, 3, C3, [128]], # 1 * 1 卷积不改变大小 152
    [-1, 1, Conv, [256, 3, 2]], # 3-P3/8  image = 76
    [-1, 6, C3, [256]], # image = 76
    [-1, 1, Conv, [512, 3, 2]], # 5-P4/16  image = 38
    [-1, 9, C3, [512]], # image = 38
    [-1, 1, Conv, [1024, 3, 2]], # 7-P5/32 image = 19
    [-1, 3, C3, [1024]], #  image = 19
    [-1, 1, SPPF, [1024, 5]], # 9
  ]

# YOLOv5 v6.0 head
head: [
    [-1, 1, Conv, [512, 1, 1]],
    [-1, 1, nn.Upsample, [None, 2, "nearest"]],
    [[-1, 6], 1, Concat, [1]], # cat backbone P4
    [-1, 3, C3, [512, False]], # 13

    [-1, 1, Conv, [256, 1, 1]],
    [-1, 1, nn.Upsample, [None, 2, "nearest"]],
    [[-1, 4], 1, Concat, [1]], # cat backbone P3
    [-1, 3, C3, [256, False]], # 17 (P3/8-small)

    [-1, 1, MP, []],
    [[-1, 14], 1, Concat, [1]], # cat head P4
    [-1, 3, C3, [512, False]], # 20 (P4/16-medium)

    [-1, 1, MP, []],
    [[-1, 10], 1, Concat, [1]], # cat head P5
    [-1, 3, C3, [1024, False]], # 23 (P5/32-large)

    [[17, 20, 23], 1, Detect, [nc, anchors]], # Detect(P3, P4, P5)
  ]
